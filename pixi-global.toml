version = 1

[envs.neovim]
channels = ["conda-forge"]
# Temporary compatibility pin: current nvim builds require the legacy
# libunibilium.so.. SONAME shipped by unibilium 2.1.2.
dependencies = { nvim = ">=0.10", unibilium = "<2.1.4" }
exposed = { nvim = "nvim" }

[envs.cli]
channels = ["conda-forge"]
dependencies = { ripgrep = "*", fd-find = "*", fzf = "*", lazygit = "*", git = "*", gcc = "*", make = "*", unzip = "*", tree-sitter-cli = "*", tmux = "*" }
exposed = { rg = "rg", fd = "fd", fzf = "fzf", lazygit = "lazygit", git = "git", gcc = "gcc", make = "make", unzip = "unzip", tree-sitter = "tree-sitter", tmux = "tmux" }

[envs.fish]
channels = ["conda-forge"]
dependencies = { fish = "*" }
exposed = { fish = "fish" }

# Node.js is kept for Neovim/Mason (JS-based LSPs & tools), NOT for Claude Code.
# Claude Code is installed as a standalone native binary in post-install.sh.
[envs.node]
channels = ["conda-forge"]
dependencies = { nodejs = ">=20" }
exposed = { node = "node", npm = "npm", npx = "npx" }

[envs.python]
channels = ["conda-forge"]
dependencies = { python = "3.12.*", uv = "*" }
exposed = { python = "python", uv = "uv" }
