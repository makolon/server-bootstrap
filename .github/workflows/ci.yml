name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -x bootstrap.sh bootstrap-all.sh post-install.sh \
            tests/run.sh tests/fakes/pixi tests/fakes/bin/*

  test-linux:
    name: tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run hermetic tests
        run: bash tests/run.sh

  test-macos:
    # bootstrap-all.sh runs on the operator's Mac, so test it (and the test
    # runner itself) with macOS's stock /bin/bash 3.2.
    name: bootstrap-all.sh (macOS /bin/bash 3.2)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run bootstrap-all.sh tests
        run: SUT_BASH=/bin/bash /bin/bash tests/run.sh bootstrap-all
